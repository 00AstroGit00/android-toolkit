# Performance Profile
# Prioritizes responsiveness and frame rate.
# May increase battery consumption.
# Safe for short-term gaming or demanding use.
#
# Part of the Android Toolkit.

# Animation scale (0.0 = off, 0.5 = fast, 1.0 = default)
# Disabling animations makes the UI feel snappier
PROFILE_ANIMATION_SCALE="0.0"

# GPU/HWUI rendering tweaks (true/false)
# Force GPU rendering for 2D and enable MSAA if available
PROFILE_HWUI="true"

# Cached apps freezer (true/false)
# Keep freezer on to prevent cached apps from consuming resources
PROFILE_FREEZER_ENABLED="true"

# ART dexopt mode (speed|speed-profile|verify|balanced)
# speed: fully compiled (faster startup, more storage used)
PROFILE_DEXOPT="speed"

# Battery saver (true/false)
PROFILE_BATTERY_SAVER="false"

# ──────────────────────────────────────────────
# Samsung-specific settings
# ──────────────────────────────────────────────

# Samsung: peak refresh rate (e.g., 120.0)
PROFILE_PEAK_REFRESH_RATE="120.0"

# Samsung: min refresh rate
# Keep at 60Hz minimum for smoother scrolling
PROFILE_MIN_REFRESH_RATE="60.0"

# Samsung: multi-core packet scheduler
PROFILE_MULTICORE_SCHED="true"

# Samsung: touch optimization (true/false)
# true: reduces long-press and multi-press delays for faster input
PROFILE_TOUCH_OPTIMIZE="true"

# Samsung: Light Performance Profile (One UI 7+)
# false: keep Standard profile for maximum performance
PROFILE_SAMSUNG_LIGHT_PERF="false"

# Samsung: Game Optimizing Service
# false: keep GOS active (it helps with sustained gaming)
PROFILE_DISABLE_GOS="false"

# Samsung: RAM Plus / virtual RAM
# 0: disabled (faster app launches, less storage wear)
# Can set to 4 or 8 for more apparent RAM
PROFILE_RAM_PLUS="0"

# Samsung: battery optimizations
# false: don't restrict background services during gaming
PROFILE_SAMSUNG_BATTERY_OPT="false"

# Samsung: display optimizations
# false: keep blur/transparency for visual quality
PROFILE_SAMSUNG_DISPLAY_OPT="false"

# Samsung: network/privacy optimizations
# false: keep services active for best connectivity
PROFILE_SAMSUNG_NETWORK_OPT="false"
