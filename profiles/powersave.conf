# Power Saving Profile
# Maximizes battery life. Reduces visual effects and
# background activity. Suitable for extending runtime.
#
# Part of the Android Toolkit.

# Animation scale (0.0 = off, 0.5 = fast, 1.0 = default)
# Disable animations to reduce GPU load
PROFILE_ANIMATION_SCALE="0.0"

# GPU/HWUI rendering tweaks (true/false)
# Keep default to save GPU power
PROFILE_HWUI="false"

# Cached apps freezer (true/false)
# Keep cached apps frozen to prevent wake-ups
PROFILE_FREEZER_ENABLED="true"

# ART dexopt mode (speed|speed-profile|verify|balanced)
# verify: minimal compilation, saves storage and battery
# Note: first launch of apps after reboot may be slightly slower
PROFILE_DEXOPT="verify"

# Battery saver (true/false)
# Enable Android's built-in battery saver
PROFILE_BATTERY_SAVER="true"

# ──────────────────────────────────────────────
# Samsung-specific settings
# ──────────────────────────────────────────────

# Samsung: peak refresh rate
# 60Hz or 0.1 (lowest possible) to save battery
PROFILE_PEAK_REFRESH_RATE="60.0"

# Samsung: min refresh rate
PROFILE_MIN_REFRESH_RATE="60.0"

# Samsung: multi-core packet scheduler
# Disabled to save power
PROFILE_MULTICORE_SCHED="false"

# Samsung: touch optimization (true/false)
# false: keep default to save power
PROFILE_TOUCH_OPTIMIZE="false"

# Samsung: Light Performance Profile (One UI 7+)
# true: caps CPU at ~70%, significant battery savings
PROFILE_SAMSUNG_LIGHT_PERF="true"

# Samsung: Game Optimizing Service
# disable: reduce background gaming overhead
PROFILE_DISABLE_GOS="disable"

# Samsung: RAM Plus / virtual RAM
# 0: disabled for better battery (less swap thrashing)
PROFILE_RAM_PLUS="0"

# Samsung: battery optimizations
# true: aggressive background restrictions
PROFILE_SAMSUNG_BATTERY_OPT="true"

# Samsung: display optimizations
# true: disable transparency and blur
PROFILE_SAMSUNG_DISPLAY_OPT="true"

# Samsung: network/privacy optimizations
# true: disable scanning, telemetry, customization
PROFILE_SAMSUNG_NETWORK_OPT="true"
