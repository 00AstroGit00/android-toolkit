# Balanced Performance Profile
# Safe for daily use. Prioritizes battery life while
# maintaining smooth UI responsiveness.
#
# Part of the Android Toolkit.

# Animation scale (0.0 = off, 0.5 = fast, 1.0 = default, 1.5 = slow)
PROFILE_ANIMATION_SCALE="0.75"

# GPU/HWUI rendering tweaks (true/false)
# Balanced: use default rendering (off)
PROFILE_HWUI="false"

# Cached apps freezer (true/false)
# Keeps cached apps frozen to save battery
PROFILE_FREEZER_ENABLED="true"

# ART dexopt mode (speed|speed-profile|verify|balanced)
# speed-profile: optimizes based on actual usage patterns
PROFILE_DEXOPT="speed-profile"

# Battery saver (true/false)
PROFILE_BATTERY_SAVER="false"

# ──────────────────────────────────────────────
# Samsung-specific settings
# ──────────────────────────────────────────────

# Samsung: peak refresh rate (e.g., 120.0, 96.0)
# Leave empty to keep current
PROFILE_PEAK_REFRESH_RATE=""

# Samsung: min refresh rate (e.g., 60.0, 24.0)
PROFILE_MIN_REFRESH_RATE="60.0"

# Samsung: multi-core packet scheduler (true/false)
PROFILE_MULTICORE_SCHED="true"

# Samsung: touch optimization (true/false)
# false: keep default touch timing
PROFILE_TOUCH_OPTIMIZE="false"

# Samsung: Light Performance Profile (One UI 7+)
# false: keep Standard profile
PROFILE_SAMSUNG_LIGHT_PERF="false"

# Samsung: Game Optimizing Service
# false: keep default
PROFILE_DISABLE_GOS="false"

# Samsung: RAM Plus / virtual RAM
# empty: don't change current setting
PROFILE_RAM_PLUS=""

# Samsung: battery optimizations
# false: don't apply additional battery restrictions
PROFILE_SAMSUNG_BATTERY_OPT="false"

# Samsung: display optimizations
# false: keep default display effects
PROFILE_SAMSUNG_DISPLAY_OPT="false"

# Samsung: network/privacy optimizations
# false: keep default network settings
PROFILE_SAMSUNG_NETWORK_OPT="false"
