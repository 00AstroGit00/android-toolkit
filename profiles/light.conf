# Light Profile
# Maximum battery savings with smooth daily-use experience.
# Uses Samsung Light Performance Profile (One UI 7+), 60Hz refresh,
# disabled GOS, no RAM Plus, and aggressive background restrictions.
# Best for: daily use, battery longevity, cooler device temperature.
#
# Part of the Android Toolkit.

# Animation scale (0.0 = off, 0.5 = fast, 1.0 = default)
# 0.5 keeps UI feeling smooth while saving power
PROFILE_ANIMATION_SCALE="0.5"

# GPU/HWUI rendering tweaks (true/false)
# Keep default to save GPU power
PROFILE_HWUI="false"

# Cached apps freezer (true/false)
# Keep cached apps frozen to prevent wake-ups
PROFILE_FREEZER_ENABLED="true"

# ART dexopt mode (speed|speed-profile|verify|balanced)
# speed-profile: good balance between performance and storage
PROFILE_DEXOPT="speed-profile"

# Battery saver (true/false)
# Don't enable Android's built-in battery saver (too aggressive)
PROFILE_BATTERY_SAVER="false"

# ──────────────────────────────────────────────
# Samsung-specific settings
# ──────────────────────────────────────────────

# Samsung: Light Performance Profile (One UI 7+)
# Caps CPU at ~70%, prioritizes battery over speed
PROFILE_SAMSUNG_LIGHT_PERF="true"

# Samsung: Game Optimizing Service
# disable: turns off GOS settings, may re-enable after reboot
# uninstall: removes GOS entirely (requires reboot)
# false: keeps default
PROFILE_DISABLE_GOS="disable"

# Samsung: RAM Plus / virtual RAM
# 0 or disabled: recommended for better performance
# Higher values use storage as swap (slower, wears flash)
PROFILE_RAM_PLUS="0"

# Samsung: peak refresh rate (e.g., 120.0, 60.0, 0.1)
# 60.0: standard smooth, good battery balance
PROFILE_PEAK_REFRESH_RATE="60.0"

# Samsung: min refresh rate
# 60.0: standard, saves battery
PROFILE_MIN_REFRESH_RATE="60.0"

# Samsung: multi-core packet scheduler
# true: improves network throughput
PROFILE_MULTICORE_SCHED="true"

# Samsung: touch optimization
# true: reduces long-press and multi-press delays
PROFILE_TOUCH_OPTIMIZE="true"

# Samsung: battery optimizations
# true: disables adaptive battery, diagnostic data, scanning
PROFILE_SAMSUNG_BATTERY_OPT="true"

# Samsung: display optimizations
# true: disables transparency, blur effects
PROFILE_SAMSUNG_DISPLAY_OPT="true"

# Samsung: network/privacy optimizations
# true: disables customization service, scanning, telemetry
PROFILE_SAMSUNG_NETWORK_OPT="true"

# Samsung: apps to restrict from running in background
# Space-separated package names
# PROFILE_RESTRICTED_APPS=""

# Samsung: apps to whitelist for never-sleep
# Space-separated package names
# PROFILE_NEVER_SLEEP_APPS=""
