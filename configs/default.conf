# Android Toolkit Default Configuration
# Override any default value here.
#
# Part of the Android Toolkit.

# Logging level: debug, info, warn, error
ANDROID_TOOLKIT_LOG_LEVEL="info"

# Default backend: auto, adb, rish
ANDROID_TOOLKIT_DEFAULT_BACKEND="auto"

# Backup directory (default: <root>/backups)
# ANDROID_TOOLKIT_BACKUP_DIR=""

# Default profile to apply when --apply is called without argument
# ANDROID_TOOLKIT_DEFAULT_PROFILE="balanced"

# Enable verbose output by default (true/false)
# ANDROID_TOOLKIT_VERBOSE="false"

# Protected packages (space-separated, overrides built-in list)
# ANDROID_TOOLKIT_EXTRA_PROTECTED=""

# Samsung-specific: enable bloatware listing on --report (true/false)
ANDROID_TOOLKIT_SHOW_BLOATWARE="true"
